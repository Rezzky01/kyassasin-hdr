name: Build KYASSASIN HDR APK
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "ai-enhancer.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/onnxruntime-web/dist/*.wasm www/
          cp node_modules/onnxruntime-web/dist/*.mjs www/
      - name: Install Capacitor
        run: npm install
      - name: Bundle local AI enhancer
        run: npx esbuild ai-enhancer.js --bundle --format=esm --outfile=www/ai-enhancer.js
      - name: Bundle native share bridge
        run: npx esbuild share-bridge.js --bundle --format=esm --outfile=www/share-bridge.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kyassasin-hdr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# Rebuild APK using the latest Firebase configuration.
